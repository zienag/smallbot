name: Health

# The cheap half of self-repair: no model, no session — a curl every half hour.
# A source dark for an hour, or an error a source caught and worked around,
# becomes one open issue labeled `health`, and the "smallbot health" cloud
# routine is started for it by an HTTP call to the routine's own endpoint
# (routines take GitHub events for pull requests and releases only, not for
# issues). The call is repeated every run until one is accepted, which the
# issue records as a comment. When /health is green again the issue is closed
# here. A miss that raised no error (a post that went out wrong or bare) shows
# nowhere in /health: it is handed to the routine as a report, which opens an
# issue labeled `reported` that only the routine closes. docs/operations.md.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      fire_test:
        description: Start the routine now, whatever /health says, to check the call
        type: boolean
        default: false
      report:
        description: A miss that raised no error, with the facts established, for the routine to fix
        type: string
        default: ""

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Keep one open issue while /health is red
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_URL: https://smallbot.zienag.workers.dev/health
          # Ticks are 15 minutes apart; four failures is an hour, not a blip.
          FAILURES_BEFORE_ISSUE: 4
          ROUTINE_FIRE_URL: https://api.anthropic.com/v1/claude_code/routines/trig_01NRsUECNabtXUdcUS29PMCa/fire
          ROUTINE_FIRE_TOKEN: ${{ secrets.ROUTINE_FIRE_TOKEN }}
          STARTED: Health routine started.
          FIRE_TEST: ${{ inputs.fire_test }}
          REPORT: ${{ inputs.report }}
        run: |
          set -eu
          # Prints the HTTP status; the answer's body is left in fire.json.
          fire() {
            curl -s -o fire.json -w '%{http_code}' --max-time 30 -X POST "$ROUTINE_FIRE_URL" \
              -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$1" '{text: $text}')" || true
          }
          answer() {
            jq -c 'del(.claude_code_session_url)' fire.json 2>/dev/null || true
          }
          if [ "$FIRE_TEST" = "true" ]; then
            code=$(fire "A test of the start call from the Health workflow. No issue is open.")
            echo "HTTP $code $(answer)"
            [ "$code" = "200" ]
            exit
          fi
          # Started once per issue; a call that was refused is repeated next run.
          start_for() {
            started=$(gh issue view "$1" --repo "$GITHUB_REPOSITORY" --json comments \
              -q "[.comments[].body | select(startswith(\"$STARTED\"))] | length")
            if [ "$started" -gt 0 ]; then
              return 0
            fi
            if [ -z "$ROUTINE_FIRE_TOKEN" ]; then
              echo "::warning::ROUTINE_FIRE_TOKEN is not set: the routine was not started for #$1"
              return 0
            fi
            code=$(fire "$2")
            if [ "$code" = "200" ]; then
              gh issue comment "$1" --repo "$GITHUB_REPOSITORY" --body "$STARTED"
            else
              echo "::warning::the routine was not started for #$1: HTTP $code $(answer)"
            fi
          }
          if [ -n "$REPORT" ]; then
            gh label create reported --repo "$GITHUB_REPOSITORY" --color fbca04 \
              --description "a miss that raised no error; closed by the health routine" 2>/dev/null || true
            created=$(gh issue create --repo "$GITHUB_REPOSITORY" --label reported \
              --title "Reported miss: $(printf '%s' "$REPORT" | head -1 | cut -c1-80)" --body "$REPORT")
            echo "$created"
          fi
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label reported --state open --json number -q '.[].number'); do
            report=$(gh issue view "$n" --repo "$GITHUB_REPOSITORY" --json body -q '.body')
            start_for "$n" "$(printf 'Reported miss, issue #%s in %s:\n%s' "$n" "$GITHUB_REPOSITORY" "$report")"
          done
          if [ -n "$REPORT" ]; then
            exit 0
          fi
          health=$(curl -sf --max-time 20 "$HEALTH_URL") \
            || health='{"ok":false,"failing":{"worker":{"failures":99,"error":"/health unreachable","since":0}}}'
          echo "$health"
          ok=$(echo "$health" | jq -r '.ok')
          worst=$(echo "$health" | jq -r '[.failing[]? | .failures // 99] | max // 0')
          warned=$(echo "$health" | jq -r '.warnings // [] | length')
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label health --state open --json number -q '.[0].number // empty')
          if [ "$ok" = "true" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "/health is green again."
            fi
            exit 0
          fi
          if [ -z "$open" ]; then
            # A warning is an error already caught once: no blip to wait out.
            if [ "$worst" -lt "$FAILURES_BEFORE_ISSUE" ] && [ "$warned" -eq 0 ]; then
              exit 0
            fi
            gh label create health --repo "$GITHUB_REPOSITORY" --color d73a4a \
              --description "opened by the Health workflow; starts the health routine" 2>/dev/null || true
            title="Sources failing or warning: $(echo "$health" | jq -r '[(.failing | keys[]), (.warnings // [] | .[].source)] | unique | join(", ")')"
            body=$(printf 'Opened by the Health workflow from `/health` at %s. The health routine takes it from here.\n\n```json\n%s\n```\n' \
              "$(date -u +%FT%TZ)" "$(echo "$health" | jq .)")
            created=$(gh issue create --repo "$GITHUB_REPOSITORY" --label health --title "$title" --body "$body")
            open=${created##*/}
          fi
          start_for "$open" "$(printf 'Health issue #%s in %s is open. /health answered:\n%s' "$open" "$GITHUB_REPOSITORY" "$health")"
